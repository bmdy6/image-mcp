[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "image-mcp"
version = "0.1.0"
description = "Local image generation through an OpenAI compatible API and MCP."
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "urllib3>=2.2,<3", "Pillow>=10,<13", "mcp>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
image-mcp = "image_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
